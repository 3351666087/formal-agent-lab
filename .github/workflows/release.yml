name: release

# Fires only when a version tag is pushed (e.g. `git tag v0.5.0 && git push origin v0.5.0`).
# Nothing is published on ordinary pushes or PRs. The tag's version drives the image tags and the GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push images to GitHub Packages (ghcr.io)

env:
  UV_VERSION: "0.12.19"
  REGISTRY: ghcr.io

jobs:
  # Build and push the four OCI images (api, worker, orders, web) to ghcr.io/<owner>/<repo>/<image>.
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api,    dockerfile: deploy/docker/python.Dockerfile, target: api }
          - { image: worker, dockerfile: deploy/docker/python.Dockerfile, target: worker }
          - { image: orders, dockerfile: deploy/docker/python.Dockerfile, target: orders }
          - { image: web,    dockerfile: deploy/docker/web.Dockerfile,    target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build the workspace wheels and cut the GitHub Release (attaching the wheels), after the images are published.
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}" }
      - name: build all workspace wheels
        run: uv build --all-packages --wheel --out-dir dist
      - name: create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          notes="var/release-notes-${version}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" dist/*.whl --title "$TAG" --notes-file "$notes" --verify-tag
          else
            gh release create "$TAG" dist/*.whl --title "$TAG" --generate-notes --verify-tag
          fi
