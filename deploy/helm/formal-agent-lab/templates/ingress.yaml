{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fal.fullname" . }}
  labels: {{- include "fal.labels" . | nindent 4 }}
  annotations:
    # Server-Sent Events: keep connections open and unbuffered
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    {{- with .Values.ingress.annotations }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "fal.fullname" . }}-web, port: { number: 80 } } }
{{- end }}
