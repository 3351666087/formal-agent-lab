    app.kubernetes.io/instance: fal
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: formal-agent-lab-0.1.0
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: migrate
          image: formal-agent-lab/api:0.1.0
          command: ["fal-migrate", "upgrade"]
          env:
            - name: FAL_DATABASE_URL
              valueFrom: { secretKeyRef: { name: formal-agent-lab-db, key: database-url } }
