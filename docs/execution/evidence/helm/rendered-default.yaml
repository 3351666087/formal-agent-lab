---
# Source: formal-agent-lab/templates/api.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fal-formal-agent-lab-api
  labels:
    app.kubernetes.io/name: formal-agent-lab
    app.kubernetes.io/instance: fal
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: formal-agent-lab-0.1.0
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: formal-agent-lab
      app.kubernetes.io/instance: fal
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: formal-agent-lab
        app.kubernetes.io/instance: fal
        app.kubernetes.io/component: api
    spec:
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: api
          image: formal-agent-lab/api:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["fal-api"]
          env:
            - name: FAL_DATABASE_URL
              valueFrom: { secretKeyRef: { name: formal-agent-lab-db, key: database-url } }
            - name: FAL_TEMPORAL_ADDRESS
              value: "temporal-frontend.temporal.svc:7233"
            - name: FAL_TEMPORAL_NAMESPACE
              value: "default"
            - name: FAL_TEMPORAL_TASK_QUEUE
              value: "formal-lab-experiments"
            - name: FAL_DEPLOYMENT_PROFILE
              value: "helm-dev"
            - name: FAL_ARTIFACT_BACKEND
              value: "s3"
            - name: FAL_S3_ENDPOINT_URL
              value: "http://minio.storage.svc:9000"
            - name: FAL_S3_BUCKET
              value: "formal-lab-artifacts"
            - name: FAL_S3_REGION
              value: "us-east-1"
            - name: FAL_S3_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: formal-agent-lab-s3, key: access-key-id } }
            - name: FAL_S3_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: formal-agent-lab-s3, key: secret-access-key } }
            - name: FAL_API_HOST
              value: "0.0.0.0"
            - name: FAL_API_PORT
              value: "8000"
          ports: [{ name: http, containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /api/v1/health/ready, port: http }, periodSeconds: 10, timeoutSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 20 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi

