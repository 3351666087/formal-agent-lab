<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>formal-agent-lab · 产品演示</title>
<style>
body { margin: 0; background: #0b0f15; font-family: 'Inter', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; color: #e6eaf1; display: grid; place-items: center; min-height: 100vh; }
main { width: min(1280px, 100% - 32px); display: grid; gap: 12px; padding: 16px 0; }
object { width: 100%; aspect-ratio: 16 / 9; border: 1px solid #222b38; border-radius: 12px; background: #0b0f15; }
.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #222b38; background: #10151e; color: #e6eaf1; cursor: pointer; }
input[type=range] { flex: 1; min-width: 200px; accent-color: #8a9bff; }
small, span { color: #8792a4; font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
</style></head><body><main>
<object id="demo" data="demo.svg" type="image/svg+xml" aria-label="产品演示动画"></object>
<div class="bar"><button id="toggle">暂停</button><input id="scrub" type="range" min="0" max="24" step="0.05" value="0" aria-label="时间">
<span id="time">0.0 s</span><small>24 s loop · reduced motion → static poster</small></div>
<small>source: docs/assets/demo.svg · generator: scripts/render_demo.py · video: demo.mp4</small>
</main><script>
const obj = document.getElementById('demo'), btn = document.getElementById('toggle'), scrub = document.getElementById('scrub'), label = document.getElementById('time');
let playing = true;
const anims = () => obj.contentDocument ? obj.contentDocument.getAnimations() : [];
function show(t) { label.textContent = (t % 24).toFixed(1) + ' s'; scrub.value = t % 24; }
btn.onclick = () => { playing = !playing; anims().forEach(a => playing ? a.play() : a.pause()); btn.textContent = playing ? '暂停' : '播放'; };
scrub.oninput = () => { playing = false; btn.textContent = '播放'; anims().forEach(a => { a.pause(); a.currentTime = scrub.value * 1000; }); show(+scrub.value); };
setInterval(() => { const a = anims()[0]; if (a && playing) show((a.currentTime || 0) / 1000); }, 100);
</script></body></html>
