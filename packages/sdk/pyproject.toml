[project]
name = "formal-lab-sdk"
version = "0.1.0"
description = "Python SDK and the fal CLI"
requires-python = ">=3.12"
dependencies = ["formal-lab-contracts", "httpx>=0.28", "typer>=0.27"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_lab_sdk"]

[project.scripts]
fal = "formal_lab_sdk.cli:main"
