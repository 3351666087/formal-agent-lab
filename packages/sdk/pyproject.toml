[project]
name = "formal-lab-sdk"
version = "0.4.0"
description = "Python SDK and the fal CLI"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["formal-lab-contracts", "httpx>=0.28", "typer>=0.27"]

[project.optional-dependencies]
# `fal model validate` type-checks offline when the model core is installed (falls back to the API otherwise)
offline = ["formal-lab-model-core"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_lab_sdk"]

[project.scripts]
fal = "formal_lab_sdk.cli:main"
