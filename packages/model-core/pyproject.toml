[project]
name = "formal-lab-model-core"
version = "0.1.0"
description = "Finite-state IR: parsing, type checking, canonical form, digests and the reference interpreter"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["formal-lab-contracts"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_lab_model"]

[project.entry-points."formal_lab.plugins"]
ir-json-frontend = "formal_lab_model.frontend:registrations"
