[project]
name = "formal-lab-runtime"
version = "0.2.0"
description = "Plugin registry, artifact stores and the step engine shared by all entry points"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["formal-lab-model-core", "boto3>=1.40", "jsonschema>=4.25"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_lab_runtime"]
