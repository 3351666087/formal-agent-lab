[project]
name = "formal-lab-env-mal"
version = "0.4.0"
description = "MAL simulator environment: bridge to the isolated mal-toolbox / mal-simulator toolchain (typed subprocess) and a session environment backed by the native attack-graph simulator"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["formal-lab-contracts", "formal-lab-domain-mal"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_lab_env_mal"]
