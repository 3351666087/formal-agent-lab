[project]
name = "formal-lab-domain-mal"
version = "0.4.0"
description = "MAL (Meta Attack Language) domain: lower a coreLang attack graph to the deterministic finite IR, with LabPolicy / TargetSecurity / BusinessSLO configuration"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["formal-lab-contracts", "formal-lab-model-core", "formal-lab-runtime", "formal-lab-domain-broker",
                "formal-lab-strategies", "formal-lab-solver-z3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_lab_domain_mal"]

[project.entry-points."formal_lab.plugins"]
domain-mal = "formal_lab_domain_mal:registrations"
