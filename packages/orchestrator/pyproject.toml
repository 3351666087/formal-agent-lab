[project]
name = "formal-lab-orchestrator"
version = "0.1.0"
description = "Temporal ExperimentWorkflow, activities and worker"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["formal-lab-platform-api", "temporalio==1.33.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_lab_orchestrator"]

[project.scripts]
fal-worker = "formal_lab_orchestrator.worker:main"
