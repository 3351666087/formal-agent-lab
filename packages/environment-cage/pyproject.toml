[project]
name = "formal-lab-env-cage"
version = "0.3.0"
description = "CAGE Challenge 4 environment bridge (phase 3B, D5): run the official CybORG 4.0 baseline in an isolated venv via a typed subprocess, and record native rounds/scores separately from platform metrics"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["formal-lab-contracts"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_lab_env_cage"]
