[project]
name = "formal-lab-evaluation"
version = "0.2.0"
description = "Metrics, aggregation, statistics, experiment matrices and the Inspect adapter"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["formal-lab-runtime", "formal-lab-strategies", "formal-lab-sdk", "inspect-ai==0.3.269"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_lab_eval"]

[project.entry-points."formal_lab.plugins"]
generic-evaluator = "formal_lab_eval.generic:registrations"

[project.scripts]
fal-report = "formal_lab_eval.offline:main"
