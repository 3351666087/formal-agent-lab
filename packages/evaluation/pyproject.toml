[project]
name = "formal-lab-evaluation"
version = "0.1.0"
description = "Metrics, aggregation, statistics, experiment matrices and the Inspect adapter"
requires-python = ">=3.12"
dependencies = ["formal-lab-contracts", "inspect-ai==0.3.269"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_lab_eval"]
