[project]
name = "formal-lab-strategies"
version = "0.1.0"
description = "Generic strategy adapters (LLM planner, model clients)"
requires-python = ">=3.12"
dependencies = ["formal-lab-model-core", "httpx>=0.28"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_lab_strategies"]

[project.entry-points."formal_lab.plugins"]
llm-planner = "formal_lab_strategies.llm_planner:registrations"
