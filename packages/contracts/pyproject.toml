[project]
name = "formal-lab-contracts"
version = "2.0.0"
description = "formal-lab-contracts v2 (v1 frozen and readable): the single source of platform data contracts, IR schema, errors and plugin interfaces"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2.13,<3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_lab_contracts"]
