[project]
name = "formal-lab-neutral-env"
version = "0.1.0"
description = "Pure-data IR world simulator implementing the Environment interface"
requires-python = ">=3.12"
dependencies = ["formal-lab-model-core"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_lab_env"]
