[project]
name = "formal-lab-solver-z3"
version = "0.1.0"
description = "Z3 compiler for deterministic_finite_v1 and bounded queries / planning"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["formal-lab-model-core", "z3-solver==5.1.0.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_lab_solver_z3"]

[project.entry-points."formal_lab.plugins"]
z3 = "formal_lab_solver_z3:registrations"
