[project]
name = "formal-lab-solver-prism-games"
version = "0.3.0"
description = "Optional PRISM-games extension: allocation-game payload, process adapter and independent verifier"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2.13,<3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_lab_solver_prism"]
