[project]
name = "formal-lab-example-scheduling"
version = "0.1.0"
description = "Neutral production-scheduling example: model, scenarios, rule strategy and scorer"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["formal-lab-neutral-env", "formal-lab-solver-z3", "formal-lab-strategies", "formal-lab-evaluation"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_lab_example_scheduling"]

[project.entry-points."formal_lab.plugins"]
neutral-scheduling = "formal_lab_example_scheduling:registrations"
