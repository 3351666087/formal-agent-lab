[project]
name = "formal-lab-example-warehouse"
version = "0.1.0"
description = "Warehouse resource allocation: a second, independently implemented semantic profile (driver, frontend, strategies, scorer)"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["formal-lab-contracts", "formal-lab-model-core"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_lab_example_warehouse"]

[project.entry-points."formal_lab.plugins"]
warehouse-allocation = "formal_lab_example_warehouse:registrations"
