[project]
name = "fal-example-external-plugin"
version = "0.2.0"
description = "Out-of-tree plugin registered only through public SDK interfaces"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["formal-lab-sdk"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fal_example_external_plugin"]

[project.entry-points."formal_lab.plugins"]
external-example = "fal_example_external_plugin:registrations"
